<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon One Shot</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #050713;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    cursor: crosshair;
}

#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 10;

    color: white;
    background: rgba(0, 0, 20, 0.85);

    padding: 15px 20px;
    border-radius: 15px;

    border: 2px solid #00bfff;

    box-shadow: 0 0 20px #008cff;

    line-height: 1.6;
}

.title {
    color: #00ffff;
    font-size: 22px;
    font-weight: bold;
}

#message {
    position: fixed;
    left: 50%;
    top: 100px;

    transform: translateX(-50%);

    font-size: 65px;

    opacity: 0;

    pointer-events: none;

    z-index: 20;

    text-shadow:
        0 0 20px white,
        0 0 40px cyan;
}

#help {
    position: fixed;
    bottom: 12px;
    left: 50%;

    transform: translateX(-50%);

    background: rgba(0,0,0,.7);

    color: white;

    padding: 8px 15px;

    border-radius: 10px;

    font-size: 13px;

    z-index: 10;

    white-space: nowrap;
}

#warning {
    position: fixed;
    right: 20px;
    top: 20px;

    color: #ff3333;

    font-size: 22px;
    font-weight: bold;

    text-shadow: 0 0 15px red;

    z-index: 10;
}
</style>
</head>

<body>

<div id="hud">

    <div class="title">🔫 NEON ONE SHOT</div>

    ❤️ Health: ∞<br>

    🔫 Ammo: ∞<br>

    🎯 Score: <span id="score">0</span><br>

    👾 Enemies: <span id="enemyCount">0</span><br>

    🌊 Wave: <span id="wave">1</span><br>

    ⚡ Weapon: <span id="weapon">ONE SHOT</span>

</div>

<div id="warning"></div>

<div id="message"></div>

<div id="help">
A/D or ←/→ = Move | SPACE = Jump | Mouse = Aim | CLICK = Shoot |
Q = Speed | E = Shield | F = Blast | 1-5 = Emotes
</div>

<canvas id="game"></canvas>

<script>

/* =========================
   CANVAS
========================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();

window.addEventListener("resize", resize);


/* =========================
   INPUT
========================= */

const keys = {};

const mouse = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    down: false
};

window.addEventListener("keydown", e => {

    keys[e.code] = true;

    if (
        e.code === "Space" ||
        e.code === "ArrowLeft" ||
        e.code === "ArrowRight" ||
        e.code === "ArrowUp"
    ) {
        e.preventDefault();
    }

    if (e.code === "KeyQ") speedAbility();
    if (e.code === "KeyE") shieldAbility();
    if (e.code === "KeyF") blastAbility();

    if (e.code === "Digit1") emote("😎");
    if (e.code === "Digit2") emote("😂");
    if (e.code === "Digit3") emote("😡");
    if (e.code === "Digit4") emote("😱");
    if (e.code === "Digit5") emote("🔥");
});

window.addEventListener("keyup", e => {
    keys[e.code] = false;
});

canvas.addEventListener("mousemove", e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

canvas.addEventListener("mousedown", e => {
    if (e.button === 0) {
        mouse.down = true;
    }
});

window.addEventListener("mouseup", e => {
    if (e.button === 0) {
        mouse.down = false;
    }
});


/* =========================
   GAME OBJECTS
========================= */

const player = {

    x: 250,
    y: 200,

    width: 46,
    height: 72,

    vx: 0,
    vy: 0,

    speed: 5,

    jumpPower: 14,

    gravity: 0.7,

    grounded: false,

    shootCooldown: 0,

    speedTimer: 0,
    shieldTimer: 0,

    speedCooldown: 0,
    shieldCooldown: 0,
    blastCooldown: 0
};

let bullets = [];
let enemies = [];
let particles = [];
let enemyBullets = [];

let score = 0;
let wave = 1;

let spawnTimer = 30;

let emoteTimer = 0;

let stars = [];


/* =========================
   STARS
========================= */

for (let i = 0; i < 150; i++) {

    stars.push({

        x: Math.random(),
        y: Math.random() * 0.6,

        size:
            Math.random() * 2 + 1,

        alpha:
            Math.random() * 0.8 + 0.2

    });
}


/* =========================
   GROUND
========================= */

function groundY() {

    return canvas.height - 90;

}


/* =========================
   EMOTES
========================= */

function emote(symbol) {

    const message =
        document.getElementById("message");

    message.textContent = symbol;

    message.style.opacity = 1;

    emoteTimer = 70;
}


/* =========================
   ABILITIES
========================= */

function speedAbility() {

    if (player.speedCooldown > 0)
        return;

    player.speed = 10;

    player.speedTimer = 300;

    player.speedCooldown = 600;

    emote("⚡");

    explosion(
        player.x + 23,
        player.y + 35,
        "#00ffff"
    );
}


function shieldAbility() {

    if (player.shieldCooldown > 0)
        return;

    player.shieldTimer = 350;

    player.shieldCooldown = 900;

    emote("🛡️");

    explosion(
        player.x + 23,
        player.y + 35,
        "#008cff"
    );
}


function blastAbility() {

    if (player.blastCooldown > 0)
        return;

    player.blastCooldown = 900;

    emote("💥");

    explosion(
        player.x + 23,
        player.y + 35,
        "#ff00ff"
    );

    for (
        let i = enemies.length - 1;
        i >= 0;
        i--
    ) {

        const enemy = enemies[i];

        const dx =
            enemy.x - player.x;

        const dy =
            enemy.y - player.y;

        const distance =
            Math.sqrt(dx * dx + dy * dy);

        if (distance < 330) {

            killEnemy(i);
        }
    }
}


/* =========================
   SHOOT
========================= */

function shoot() {

    if (player.shootCooldown > 0)
        return;

    const startX =
        player.x + player.width / 2;

    const startY =
        player.y + player.height / 2;

    const dx =
        mouse.x - startX;

    const dy =
        mouse.y - startY;

    const distance =
        Math.sqrt(dx * dx + dy * dy);

    if (distance === 0)
        return;

    bullets.push({

        x: startX,

        y: startY,

        vx: dx / distance * 17,

        vy: dy / distance * 17,

        life: 100,

        size: 8
    });

    player.shootCooldown = 6;

    explosion(
        startX,
        startY,
        "#00ffff"
    );
}


/* =========================
   PLAYER UPDATE
========================= */

function updatePlayer() {

    if (
        keys["KeyA"] ||
        keys["ArrowLeft"]
    ) {

        player.vx = -player.speed;

    }
    else if (
        keys["KeyD"] ||
        keys["ArrowRight"]
    ) {

        player.vx = player.speed;

    }
    else {

        player.vx *= 0.8;

    }


    if (
        (
            keys["Space"] ||
            keys["KeyW"] ||
            keys["ArrowUp"]
        )
        &&
        player.grounded
    ) {

        player.vy =
            -player.jumpPower;

        player.grounded = false;
    }


    player.vy += player.gravity;

    player.x += player.vx;

    player.y += player.vy;


    if (player.x < 0)
        player.x = 0;


    if (
        player.x + player.width >
        canvas.width
    ) {

        player.x =
            canvas.width -
            player.width;
    }


    const floor = groundY();


    if (
        player.y +
        player.height >=
        floor
    ) {

        player.y =
            floor -
            player.height;

        player.vy = 0;

        player.grounded = true;

    }
    else {

        player.grounded = false;

    }


    if (player.shootCooldown > 0)
        player.shootCooldown--;


    if (player.speedTimer > 0) {

        player.speedTimer--;

    }
    else {

        player.speed = 5;

    }


    if (player.shieldTimer > 0)
        player.shieldTimer--;


    if (player.speedCooldown > 0)
        player.speedCooldown--;


    if (player.shieldCooldown > 0)
        player.shieldCooldown--;


    if (player.blastCooldown > 0)
        player.blastCooldown--;


    if (mouse.down)
        shoot();
}


/* =========================
   SPAWN ENEMIES
========================= */

function spawnEnemy() {

    const typeRoll =
        Math.random();

    let enemy;


    if (typeRoll < 0.15) {

        enemy = {

            type: "tank",

            x:
                Math.random() < 0.5
                ? -80
                : canvas.width + 80,

            y:
                groundY() - 80,

            width: 65,

            height: 80,

            speed:
                0.8 + wave * 0.04,

            health:
                999999,

            maxHealth:
                999999,

            shootTimer: 70

        };

    }
    else if (typeRoll < 0.4) {

        enemy = {

            type: "fast",

            x:
                Math.random() < 0.5
                ? -60
                : canvas.width + 60,

            y:
                groundY() - 50,

            width: 38,

            height: 50,

            speed:
                3 + wave * 0.1,

            health:
                999999,

            maxHealth:
                999999,

            shootTimer: 100

        };

    }
    else {

        enemy = {

            type: "normal",

            x:
                Math.random() < 0.5
                ? -60
                : canvas.width + 60,

            y:
                groundY() - 58,

            width: 44,

            height: 58,

            speed:
                1.5 + wave * 0.1,

            health:
                999999,

            maxHealth:
                999999,

            shootTimer: 90

        };

    }


    enemies.push(enemy);
}


/* =========================
   KILL ENEMY
========================= */

function killEnemy(index) {

    const enemy = enemies[index];

    if (enemy.type === "tank") {

        score += 60;

    }
    else if (enemy.type === "fast") {

        score += 25;

    }
    else {

        score += 10;

    }


    explosion(

        enemy.x +
        enemy.width / 2,

        enemy.y +
        enemy.height / 2,

        enemy.type === "tank"
            ? "#ff00ff"
            : "#ff4400"

    );


    emote("💀");


    enemies.splice(index, 1);
}


/* =========================
   ENEMY SHOOTING
========================= */

function enemyShoot(enemy) {

    const startX =
        enemy.x + enemy.width / 2;

    const startY =
        enemy.y + enemy.height / 2;

    const dx =
        player.x +
        player.width / 2 -
        startX;

    const dy =
        player.y +
        player.height / 2 -
        startY;

    const distance =
        Math.sqrt(dx * dx + dy * dy);


    enemyBullets.push({

        x: startX,

        y: startY,

        vx: dx / distance * 5,

        vy: dy / distance * 5,

        life: 180,

        size:
            enemy.type === "tank"
            ? 9
            : 5,

        color:
            enemy.type === "tank"
            ? "#ff00ff"
            : "#ff3333"
    });
}


/* =========================
   UPDATE ENEMIES
========================= */

function updateEnemies() {

    spawnTimer--;

    if (spawnTimer <= 0) {

        spawnEnemy();

        spawnTimer =
            Math.max(
                18,
                85 - wave * 3
            );
    }


    wave =
        Math.floor(score / 100) + 1;


    for (
        let i = enemies.length - 1;
        i >= 0;
        i--
    ) {

        const enemy = enemies[i];


        if (
            enemy.x < player.x
        ) {

            enemy.x += enemy.speed;

        }
        else {

            enemy.x -= enemy.speed;

        }


        enemy.shootTimer--;


        if (
            enemy.shootTimer <= 0
        ) {

            enemyShoot(enemy);

            enemy.shootTimer =
                enemy.type === "tank"
                ? 60
                : 100;
        }
    }
}


/* =========================
   PLAYER BULLETS
========================= */

function updateBullets() {

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        const bullet = bullets[i];

        bullet.x += bullet.vx;
        bullet.y += bullet.vy;

        bullet.life--;


        if (bullet.life <= 0) {

            bullets.splice(i, 1);

            continue;
        }


        for (
            let j = enemies.length - 1;
            j >= 0;
            j--
        ) {

            const enemy = enemies[j];


            if (

                bullet.x > enemy.x &&

                bullet.x <
                enemy.x + enemy.width &&

                bullet.y > enemy.y &&

                bullet.y <
                enemy.y + enemy.height

            ) {

                /*
                 * ONE SHOT!
                 * Any enemy hit by the player's
                 * bullet is immediately destroyed.
                 */

                enemy.health = 0;


                bullets.splice(i, 1);


                killEnemy(j);


                break;
            }
        }
    }
}


/* =========================
   ENEMY BULLETS
========================= */

function updateEnemyBullets() {

    for (
        let i =
            enemyBullets.length - 1;

        i >= 0;

        i--
    ) {

        const bullet =
            enemyBullets[i];


        bullet.x += bullet.vx;
        bullet.y += bullet.vy;

        bullet.life--;


        if (bullet.life <= 0) {

            enemyBullets.splice(i, 1);

            continue;
        }


        if (

            bullet.x > player.x &&

            bullet.x <
            player.x + player.width &&

            bullet.y > player.y &&

            bullet.y <
            player.y + player.height

        ) {

            if (
                player.shieldTimer <= 0
            ) {

                explosion(
                    bullet.x,
                    bullet.y,
                    "#ff0000"
                );

            }

            enemyBullets.splice(i, 1);
        }
    }
}


/* =========================
   PARTICLES
========================= */

function explosion(x, y, color) {

    for (
        let i = 0;
        i < 18;
        i++
    ) {

        particles.push({

            x: x,

            y: y,

            vx:
                (Math.random() - 0.5) * 10,

            vy:
                (Math.random() - 0.5) * 10,

            life:
                25 +
                Math.random() * 25,

            color: color

        });
    }
}


function updateParticles() {

    for (
        let i =
            particles.length - 1;

        i >= 0;

        i--
    ) {

        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.vx *= 0.95;
        p.vy *= 0.95;

        p.life--;

        if (p.life <= 0) {

            particles.splice(i, 1);
        }
    }
}


/* =========================
   BACKGROUND
========================= */

function drawBackground() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            canvas.height
        );

    gradient.addColorStop(
        0,
        "#020514"
    );

    gradient.addColorStop(
        0.5,
        "#102348"
    );

    gradient.addColorStop(
        1,
        "#162b38"
    );


    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* Moon */

    ctx.shadowBlur = 35;
    ctx.shadowColor = "#66bbff";

    ctx.fillStyle = "#e9f7ff";

    ctx.beginPath();

    ctx.arc(
        canvas.width - 130,
        100,
        45,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.shadowBlur = 0;


    /* Stars */

    for (const star of stars) {

        ctx.globalAlpha =
            star.alpha;

        ctx.fillStyle =
            "#ffffff";

        ctx.fillRect(

            star.x *
            canvas.width,

            star.y *
            canvas.height,

            star.size,

            star.size

        );
    }

    ctx.globalAlpha = 1;


    /* Buildings */

    drawBuildings("#0a1224", 170);

    drawBuildings("#111e35", 230);


    /* Ground */

    const floor = groundY();

    ctx.fillStyle = "#060a12";

    ctx.fillRect(
        0,
        floor,
        canvas.width,
        canvas.height - floor
    );


    ctx.shadowBlur = 15;
    ctx.shadowColor = "#00eaff";

    ctx.fillStyle = "#00eaff";

    ctx.fillRect(
        0,
        floor,
        canvas.width,
        3
    );

    ctx.shadowBlur = 0;
}


function drawBuildings(color, maxHeight) {

    const floor = groundY();

    ctx.fillStyle = color;


    for (
        let x = -50;
        x < canvas.width + 100;
        x += 80
    ) {

        const height =
            80 +
            Math.abs(
                Math.sin(x * 0.05)
            ) *
            maxHeight;


        ctx.fillRect(
            x,
            floor - height,
            70,
            height
        );


        for (
            let y =
                floor - height + 20;

            y <
                floor - 15;

            y += 25
        ) {

            if (
                Math.random() > 0.45
            ) {

                ctx.fillStyle =
                    Math.random() > 0.5
                    ? "#00ccff"
                    : "#ff33cc";

                ctx.globalAlpha = 0.5;

                ctx.fillRect(
                    x + 15,
                    y,
                    7,
                    5
                );

                ctx.globalAlpha = 1;

                ctx.fillStyle = color;
            }
        }
    }
}


/* =========================
   DRAW PLAYER
========================= */

function drawPlayer() {

    const cx =
        player.x +
        player.width / 2;


    /* Shield */

    if (player.shieldTimer > 0) {

        ctx.strokeStyle = "#008cff";

        ctx.lineWidth = 5;

        ctx.shadowBlur = 25;

        ctx.shadowColor = "#008cff";

        ctx.beginPath();

        ctx.arc(
            cx,
            player.y + 35,
            60,
            0,
            Math.PI * 2
        );

        ctx.stroke();

        ctx.shadowBlur = 0;
    }


    /* Shadow */

    ctx.fillStyle =
        "rgba(0,0,0,.5)";

    ctx.beginPath();

    ctx.ellipse(
        cx,
        groundY() + 5,
        28,
        7,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Legs */

    ctx.fillStyle = "#252a38";

    ctx.fillRect(
        player.x + 7,
        player.y + 48,
        12,
        20
    );

    ctx.fillRect(
        player.x + 27,
        player.y + 48,
        12,
        20
    );


    /* Body */

    ctx.fillStyle = "#1268a5";

    ctx.fillRect(
        player.x + 4,
        player.y + 22,
        38,
        31
    );


    ctx.fillStyle = "#2998dc";

    ctx.fillRect(
        player.x + 11,
        player.y + 27,
        24,
        19
    );


    /* Energy core */

    ctx.fillStyle = "#00ffff";

    ctx.shadowBlur = 15;
    ctx.shadowColor = "#00ffff";

    ctx.beginPath();

    ctx.arc(
        cx,
        player.y + 36,
        5,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.shadowBlur = 0;


    /* Neck */

    ctx.fillStyle = "#c88960";

    ctx.fillRect(
        cx - 7,
        player.y + 17,
        14,
        9
    );


    /* Head */

    ctx.fillStyle = "#f0ae78";

    ctx.beginPath();

    ctx.arc(
        cx,
        player.y + 14,
        17,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Hair */

    ctx.fillStyle = "#20140f";

    ctx.beginPath();

    ctx.arc(
        cx,
        player.y + 8,
        17,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();


    /* Eyes */

    ctx.fillStyle = "white";

    ctx.fillRect(
        cx - 11,
        player.y + 11,
        8,
        6
    );

    ctx.fillRect(
        cx + 3,
        player.y + 11,
        8,
        6
    );


    /* Arms */

    ctx.fillStyle = "#f0ae78";

    ctx.fillRect(
        player.x - 8,
        player.y + 26,
        11,
        25
    );

    ctx.fillRect(
        player.x + 42,
        player.y + 26,
        11,
        25
    );


    /* Gun */

    const dx =
        mouse.x - cx;

    const dy =
        mouse.y -
        (player.y + 35);

    const angle =
        Math.atan2(dy, dx);


    ctx.save();

    ctx.translate(
        cx,
        player.y + 35
    );

    ctx.rotate(angle);


    ctx.fillStyle = "#181818";

    ctx.fillRect(
        8,
        -7,
        58,
        14
    );


    /* Gun glow */

    ctx.fillStyle = "#00ffff";

    ctx.shadowBlur = 15;

    ctx.shadowColor = "#00ffff";

    ctx.fillRect(
        30,
        -3,
        15,
        6
    );


    ctx.shadowBlur = 0;

    ctx.restore();
}


/* =========================
   DRAW ENEMIES
========================= */

function drawEnemies() {

    for (const enemy of enemies) {

        if (enemy.type === "tank") {

            drawTank(enemy);

        }
        else if (enemy.type === "fast") {

            drawFast(enemy);

        }
        else {

            drawNormal(enemy);

        }
    }
}


function drawNormal(enemy) {

    ctx.fillStyle = "#c52f3b";

    ctx.fillRect(
        enemy.x + 3,
        enemy.y + 20,
        enemy.width - 6,
        enemy.height - 20
    );


    ctx.fillStyle = "#71302a";

    ctx.beginPath();

    ctx.arc(
        enemy.x + enemy.width / 2,
        enemy.y + 15,
        16,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle = "#ffff00";

    ctx.fillRect(
        enemy.x + 10,
        enemy.y + 11,
        7,
        5
    );

    ctx.fillRect(
        enemy.x + 27,
        enemy.y + 11,
        7,
        5
    );
}


function drawFast(enemy) {

    ctx.fillStyle = "#9b35c7";

    ctx.beginPath();

    ctx.moveTo(
        enemy.x + enemy.width / 2,
        enemy.y
    );

    ctx.lineTo(
        enemy.x + enemy.width,
        enemy.y + enemy.height
    );

    ctx.lineTo(
        enemy.x,
        enemy.y + enemy.height
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle = "#ff00ff";

    ctx.shadowBlur = 15;

    ctx.shadowColor = "#ff00ff";

    ctx.fillRect(
        enemy.x + 9,
        enemy.y + 18,
        enemy.width - 18,
        7
    );

    ctx.shadowBlur = 0;
}


function drawTank(enemy) {

    ctx.fillStyle = "#34495e";

    ctx.fillRect(
        enemy.x,
        enemy.y + 15,
        enemy.width,
        enemy.height - 15
    );


    ctx.fillStyle = "#617789";

    ctx.beginPath();

    ctx.arc(
        enemy.x + enemy.width / 2,
        enemy.y + 15,
        23,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle = "#222";

    ctx.fillRect(
        enemy.x + 30,
        enemy.y + 10,
        35,
        10
    );


    ctx.fillStyle = "#ff0055";

    ctx.shadowBlur = 20;

    ctx.shadowColor = "#ff0055";

    ctx.beginPath();

    ctx.arc(
        enemy.x + enemy.width / 2,
        enemy.y + 15,
        7,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.shadowBlur = 0;
}


/* =========================
   DRAW BULLETS
========================= */

function drawBullets() {

    for (const bullet of bullets) {

        ctx.fillStyle = "#00ffff";

        ctx.shadowBlur = 25;

        ctx.shadowColor = "#00ffff";

        ctx.beginPath();

        ctx.arc(
            bullet.x,
            bullet.y,
            bullet.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.shadowBlur = 0;
    }
}


function drawEnemyBullets() {

    for (const bullet of enemyBullets) {

        ctx.fillStyle =
            bullet.color;

        ctx.shadowBlur = 15;

        ctx.shadowColor =
            bullet.color;

        ctx.beginPath();

        ctx.arc(
            bullet.x,
            bullet.y,
            bullet.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.shadowBlur = 0;
    }
}


/* =========================
   PARTICLES
========================= */

function drawParticles() {

    for (const p of particles) {

        ctx.globalAlpha =
            p.life / 50;

        ctx.fillStyle =
            p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            3,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}


/* =========================
   CROSSHAIR
========================= */

function drawCrosshair() {

    ctx.strokeStyle = "#ffffff";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.arc(
        mouse.x,
        mouse.y,
        11,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        mouse.x - 20,
        mouse.y
    );

    ctx.lineTo(
        mouse.x - 5,
        mouse.y
    );

    ctx.moveTo(
        mouse.x + 5,
        mouse.y
    );

    ctx.lineTo(
        mouse.x + 20,
        mouse.y
    );

    ctx.moveTo(
        mouse.x,
        mouse.y - 20
    );

    ctx.lineTo(
        mouse.x,
        mouse.y - 5
    );

    ctx.moveTo(
        mouse.x,
        mouse.y + 5
    );

    ctx.lineTo(
        mouse.x,
        mouse.y + 20
    );

    ctx.stroke();
}


/* =========================
   UI
========================= */

function updateUI() {

    document.getElementById("score")
        .textContent = score;

    document.getElementById("enemyCount")
        .textContent = enemies.length;

    document.getElementById("wave")
        .textContent = wave;


    const tank =
        enemies.some(
            e => e.type === "tank"
        );


    document.getElementById("warning")
        .textContent =
            tank
            ? "⚠️ TANK INCOMING!"
            : "";


    if (emoteTimer > 0) {

        emoteTimer--;

    }
    else {

        document.getElementById(
            "message"
        ).style.opacity = 0;
    }
}


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    updatePlayer();

    updateEnemies();

    updateBullets();

    updateEnemyBullets();

    updateParticles();


    drawBackground();

    drawBullets();

    drawEnemyBullets();

    drawEnemies();

    drawPlayer();

    drawParticles();

    drawCrosshair();


    updateUI();


    requestAnimationFrame(
        gameLoop
    );
}


/* =========================
   START
========================= */

gameLoop();

</script>

</html>
