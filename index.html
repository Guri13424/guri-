<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guri's Game</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #222;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#game {
    position: relative;
    width: 400px;
    height: 600px;
    max-width: 100vw;
    max-height: 100vh;
    overflow: hidden;
    border: 4px solid #111;
    background: #70c5ce;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

/* =========================
   COLORFUL GAME HEADING
========================= */

.game-heading {
    position: absolute;
    top: 65px;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 5;
    pointer-events: none;

    font-size: 34px;
    font-weight: 900;
    letter-spacing: 2px;

    background: linear-gradient(
        90deg,
        #ff0000,
        #ff7a00,
        #ffee00,
        #00d639,
        #00c8ff,
        #5b4cff,
        #d600ff,
        #ff0000
    );

    background-size: 300% auto;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation: rainbow 4s linear infinite;

    text-shadow: 2px 2px 0 rgba(0,0,0,0.25);
}

@keyframes rainbow {
    0% {
        background-position: 0% center;
    }

    100% {
        background-position: 300% center;
    }
}


/* =========================
   SCORE
========================= */

#score {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);

    color: white;
    font-size: 48px;
    font-weight: bold;

    text-shadow:
        3px 3px #333;

    z-index: 6;
    pointer-events: none;
}


/* =========================
   HIGH SCORE TOP LEFT
========================= */

#highScore {
    position: absolute;
    top: 12px;
    left: 12px;

    padding: 7px 10px;

    background: rgba(0, 0, 0, 0.35);

    border-radius: 8px;

    color: #ffe600;

    font-size: 15px;
    font-weight: bold;

    text-shadow: 2px 2px #333;

    z-index: 10;
    pointer-events: none;
}


/* =========================
   PAUSE BUTTON
========================= */

#pauseBtn {
    position: absolute;
    top: 10px;
    right: 10px;

    z-index: 10;

    padding: 8px 13px;

    border: 2px solid #222;
    border-radius: 8px;

    background: white;
    color: #222;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;
}


/* =========================
   MESSAGE
========================= */

#message {
    position: absolute;

    top: 45%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 90%;

    text-align: center;

    color: white;

    font-size: 27px;
    font-weight: bold;

    line-height: 1.5;

    text-shadow: 3px 3px #333;

    z-index: 20;
}


/* =========================
   BUTTONS
========================= */

.action {
    margin-top: 12px;

    padding: 10px 25px;

    border: 3px solid #222;

    border-radius: 10px;

    background: #ffcc33;

    color: #222;

    font-size: 19px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 4px #9b7610;
}

.action:active {
    transform: translateY(3px);
    box-shadow: 0 1px #9b7610;
}

#newRecord {
    color: #ffe600;
    font-size: 21px;
}
</style>
</head>

<body>

<div id="game">

    <canvas
        id="canvas"
        width="400"
        height="600">
    </canvas>


    <!-- SCORE -->
    <div id="score">0</div>


    <!-- HIGH SCORE TOP LEFT -->
    <div id="highScore">
        🏆 High Score: 0
    </div>


    <!-- COLORFUL HEADING -->
    <div class="game-heading">
        Guri's Game
    </div>


    <!-- PAUSE -->
    <button id="pauseBtn">
        ⏸ Pause
    </button>


    <!-- MESSAGE -->
    <div id="message">
        Click / Tap / Space<br>
        to Start
    </div>

</div>


<script>

"use strict";


// ==========================================
// CANVAS
// ==========================================

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const scoreElement =
    document.getElementById("score");

const highScoreElement =
    document.getElementById("highScore");

const messageElement =
    document.getElementById("message");

const pauseBtn =
    document.getElementById("pauseBtn");

const W = canvas.width;
const H = canvas.height;


// ==========================================
// GAME SETTINGS
// ==========================================

const gravity = 0.42;

const jumpStrength = -7.2;

const pipeSpeed = 2.7;

const pipeWidth = 65;

const pipeGap = 155;

const groundHeight = 45;


// ==========================================
// VARIABLES
// ==========================================

let bird;

let pipes = [];

let score = 0;

let highScore =
    Number(
        localStorage.getItem(
            "guriHighScore"
        )
    ) || 0;

let gameState = "ready";

let lastTime = 0;

let pipeTimer = 0;

let groundOffset = 0;


// ==========================================
// DISPLAY HIGH SCORE
// ==========================================

highScoreElement.textContent =
    "🏆 High Score: " + highScore;


// ==========================================
// RESET
// ==========================================

function resetGame() {

    bird = {

        x: 90,

        y: H / 2,

        width: 34,

        height: 26,

        velocity: 0,

        rotation: 0
    };


    pipes = [];

    score = 0;

    pipeTimer = 0;

    groundOffset = 0;


    scoreElement.textContent = "0";


    gameState = "ready";


    pauseBtn.textContent =
        "⏸ Pause";


    messageElement.innerHTML =
        "Click / Tap / Space<br>to Start";


    messageElement.style.display =
        "block";
}


// ==========================================
// FLAP
// ==========================================

function flap() {

    if (gameState === "ready") {

        gameState = "playing";

        messageElement.style.display =
            "none";

        bird.velocity =
            jumpStrength;

        return;
    }


    if (gameState === "playing") {

        bird.velocity =
            jumpStrength;

        return;
    }


    if (gameState === "paused") {

        resumeGame();

        bird.velocity =
            jumpStrength;

        return;
    }


    if (gameState === "gameover") {

        resetGame();

        gameState = "playing";

        messageElement.style.display =
            "none";

        bird.velocity =
            jumpStrength;
    }
}


// ==========================================
// PAUSE
// ==========================================

function pauseGame() {

    if (gameState !== "playing") {
        return;
    }


    gameState = "paused";


    pauseBtn.textContent =
        "▶ Resume";


    messageElement.innerHTML =
        "GAME PAUSED<br>" +
        '<button class="action" id="resumeButton">Resume</button>';


    messageElement.style.display =
        "block";


    document
        .getElementById("resumeButton")
        .addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                resumeGame();
            }
        );
}


// ==========================================
// RESUME
// ==========================================

function resumeGame() {

    if (gameState !== "paused") {
        return;
    }


    gameState = "playing";


    pauseBtn.textContent =
        "⏸ Pause";


    messageElement.style.display =
        "none";
}


// ==========================================
// PAUSE BUTTON
// ==========================================

pauseBtn.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();


        if (gameState === "playing") {

            pauseGame();

        } else if (gameState === "paused") {

            resumeGame();
        }
    }
);


// ==========================================
// CREATE PIPE
// ==========================================

function createPipe() {

    const minTop = 70;

    const maxTop =
        H -
        groundHeight -
        pipeGap -
        70;


    const top =
        Math.random() *
        (maxTop - minTop) +
        minTop;


    pipes.push({

        x: W + 10,

        top: top,

        bottom:
            top + pipeGap,

        passed: false
    });
}


// ==========================================
// COLLISION
// ==========================================

function collision(a, b) {

    return (

        a.x <
        b.x + b.width &&

        a.x + a.width >
        b.x &&

        a.y <
        b.y + b.height &&

        a.y + a.height >
        b.y
    );
}


function checkCollisions() {

    if (bird.y <= 0) {

        return true;
    }


    if (
        bird.y +
        bird.height >=
        H - groundHeight
    ) {

        return true;
    }


    for (const pipe of pipes) {

        const topPipe = {

            x: pipe.x,

            y: 0,

            width: pipeWidth,

            height: pipe.top
        };


        const bottomPipe = {

            x: pipe.x,

            y: pipe.bottom,

            width: pipeWidth,

            height:
                H -
                groundHeight -
                pipe.bottom
        };


        if (

            collision(
                bird,
                topPipe
            )

            ||

            collision(
                bird,
                bottomPipe
            )

        ) {

            return true;
        }
    }


    return false;
}


// ==========================================
// GAME OVER
// ==========================================

function gameOver() {

    gameState =
        "gameover";


    let newRecord =
        false;


    if (score > highScore) {

        highScore =
            score;


        localStorage.setItem(
            "guriHighScore",
            highScore
        );


        highScoreElement.textContent =
            "🏆 High Score: " +
            highScore;


        newRecord =
            true;
    }


    messageElement.innerHTML =

        "GAME OVER<br>" +

        "Score: " +
        score +
        "<br>" +

        "High Score: " +
        highScore +

        (

            newRecord

            ?

            '<br><span id="newRecord">🏆 NEW HIGH SCORE!</span>'

            :

            ""
        ) +

        '<br><button class="action" id="restartButton">Play Again</button>';


    messageElement.style.display =
        "block";


    document
        .getElementById("restartButton")
        .addEventListener(
            "click",
            function(event) {

                event.stopPropagation();


                resetGame();


                gameState =
                    "playing";


                messageElement.style.display =
                    "none";


                bird.velocity =
                    jumpStrength;
            }
        );
}


// ==========================================
// UPDATE
// ==========================================

function update(delta) {

    if (gameState !== "playing") {
        return;
    }


    // Bird
    bird.velocity +=
        gravity * delta;


    bird.y +=
        bird.velocity * delta;


    // Rotation
    bird.rotation =
        Math.min(
            Math.max(
                bird.velocity * 0.08,
                -0.5
            ),
            1.2
        );


    // Pipe timer
    pipeTimer +=
        delta;


    if (pipeTimer > 95) {

        createPipe();

        pipeTimer = 0;
    }


    // Move pipes
    for (const pipe of pipes) {

        pipe.x -=
            pipeSpeed * delta;


        if (

            !pipe.passed &&

            pipe.x +
            pipeWidth <
            bird.x

        ) {

            pipe.passed =
                true;


            score++;


            scoreElement.textContent =
                score;
        }
    }


    // Remove pipes
    pipes =
        pipes.filter(
            pipe =>
                pipe.x +
                pipeWidth >
                -10
        );


    // Ground
    groundOffset =
        (
            groundOffset +
            pipeSpeed * delta
        ) % 24;


    // Collision
    if (checkCollisions()) {

        gameOver();
    }
}


// ==========================================
// BACKGROUND
// ==========================================

function drawBackground() {

    ctx.fillStyle =
        "#70c5ce";


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    drawCloud(
        70,
        120,
        0.8
    );


    drawCloud(
        290,
        170,
        0.6
    );


    drawCloud(
        180,
        260,
        0.45
    );
}


function drawCloud(
    x,
    y,
    scale
) {

    ctx.fillStyle =
        "rgba(255,255,255,0.8)";


    ctx.beginPath();


    ctx.arc(
        x,
        y,
        20 * scale,
        0,
        Math.PI * 2
    );


    ctx.arc(
        x + 25 * scale,
        y - 8 * scale,
        27 * scale,
        0,
        Math.PI * 2
    );


    ctx.arc(
        x + 55 * scale,
        y,
        20 * scale,
        0,
        Math.PI * 2
    );


    ctx.fill();
}


// ==========================================
// PIPES
// ==========================================

function drawPipe(pipe) {

    const capHeight =
        25;


    // Top
    ctx.fillStyle =
        "#5acb3c";


    ctx.fillRect(
        pipe.x,
        0,
        pipeWidth,
        pipe.top
    );


    // Top cap
    ctx.fillStyle =
        "#47ad2e";


    ctx.fillRect(
        pipe.x - 5,
        pipe.top -
            capHeight,
        pipeWidth + 10,
        capHeight
    );


    // Bottom
    ctx.fillStyle =
        "#5acb3c";


    ctx.fillRect(
        pipe.x,
        pipe.bottom,
        pipeWidth,
        H -
            groundHeight -
            pipe.bottom
    );


    // Bottom cap
    ctx.fillStyle =
        "#47ad2e";


    ctx.fillRect(
        pipe.x - 5,
        pipe.bottom,
        pipeWidth + 10,
        capHeight
    );


    // Highlights
    ctx.fillStyle =
        "rgba(255,255,255,0.18)";


    ctx.fillRect(
        pipe.x + 8,
        0,
        8,
        pipe.top -
            capHeight
    );


    ctx.fillRect(
        pipe.x + 8,
        pipe.bottom +
            capHeight,
        8,
        H -
            groundHeight -
            pipe.bottom
    );
}


// ==========================================
// BIRD
// ==========================================

function drawBird() {

    ctx.save();


    const centerX =
        bird.x +
        bird.width / 2;


    const centerY =
        bird.y +
        bird.height / 2;


    ctx.translate(
        centerX,
        centerY
    );


    ctx.rotate(
        bird.rotation
    );


    // Body
    ctx.fillStyle =
        "#ffd21f";


    ctx.beginPath();


    ctx.ellipse(
        0,
        0,
        18,
        14,
        0,
        0,
        Math.PI * 2
    );


    ctx.fill();


    // Wing
    ctx.fillStyle =
        "#f5b900";


    ctx.beginPath();


    ctx.ellipse(
        -6,
        6,
        10,
        6,
        -0.3,
        0,
        Math.PI * 2
    );


    ctx.fill();


    // Eye
    ctx.fillStyle =
        "white";


    ctx.beginPath();


    ctx.arc(
        8,
        -7,
        6,
        0,
        Math.PI * 2
    );


    ctx.fill();


    // Pupil
    ctx.fillStyle =
        "#111";


    ctx.beginPath();


    ctx.arc(
        10,
        -7,
        2.5,
        0,
        Math.PI * 2
    );


    ctx.fill();


    // Beak
    ctx.fillStyle =
        "#f47c20";


    ctx.beginPath();


    ctx.moveTo(
        15,
        -1
    );


    ctx.lineTo(
        28,
        3
    );


    ctx.lineTo(
        15,
        7
    );


    ctx.closePath();


    ctx.fill();


    ctx.restore();
}


// ==========================================
// GROUND
// ==========================================

function drawGround() {

    // Grass
    ctx.fillStyle =
        "#72c43c";


    ctx.fillRect(
        0,
        H - groundHeight,
        W,
        10
    );


    // Ground
    ctx.fillStyle =
        "#ded895";


    ctx.fillRect(
        0,
        H - groundHeight + 10,
        W,
        groundHeight - 10
    );


    // Stripes
    ctx.fillStyle =
        "#c9c27e";


    for (
        let x = -24 + groundOffset;
        x < W + 24;
        x += 24
    ) {

        ctx.fillRect(
            x,
            H - groundHeight + 12,
            12,
            groundHeight - 12
        );
    }
}


// ==========================================
// DRAW
// ==========================================

function draw() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawBackground();


    for (const pipe of pipes) {

        drawPipe(pipe);
    }


    drawGround();


    drawBird();
}


// ==========================================
// GAME LOOP
// ==========================================

function gameLoop(timestamp) {

    if (!lastTime) {

        lastTime =
            timestamp;
    }


    let delta =
        (timestamp -
            lastTime) /
        16.67;


    lastTime =
        timestamp;


    delta =
        Math.min(
            delta,
            2
        );


    update(delta);

    draw();


    requestAnimationFrame(
        gameLoop
    );
}


// ==========================================
// KEYBOARD
// ==========================================

document.addEventListener(
    "keydown",
    function(event) {

        if (

            event.code === "Space" ||

            event.code === "ArrowUp"

        ) {

            event.preventDefault();

            flap();
        }


        // P = pause/resume
        if (
            event.code === "KeyP"
        ) {

            if (
                gameState ===
                "playing"
            ) {

                pauseGame();

            } else if (
                gameState ===
                "paused"
            ) {

                resumeGame();
            }
        }
    }
);


// ==========================================
// MOUSE
// ==========================================

canvas.addEventListener(
    "mousedown",
    function() {

        flap();
    }
);


// ==========================================
// TOUCH
// ==========================================

canvas.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        flap();

    },
    {
        passive: false
    }
);


// ==========================================
// START
// ==========================================

resetGame();

requestAnimationFrame(
    gameLoop
);

</script>

</body>
</html>
